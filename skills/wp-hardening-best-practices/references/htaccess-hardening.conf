# WordPress server hardening rules (Apache .htaccess + nginx equivalents).
# Apache directives below assume Apache 2.4+ (Require syntax). Test in staging first.

# =====================================================================
# APACHE (.htaccess in web root unless noted)
# =====================================================================

# --- Protect wp-config.php -------------------------------------------
<Files wp-config.php>
    Require all denied
</Files>

# --- Protect .htaccess itself and dotfiles ---------------------------
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# --- Protect debug.log and common sensitive files --------------------
<FilesMatch "(?i:^(debug\.log|readme\.html|license\.txt|wp-config-sample\.php)$)">
    Require all denied
</FilesMatch>

# --- Deny PHP execution in uploads -----------------------------------
# Place this block in: wp-content/uploads/.htaccess
# <FilesMatch "\.(?i:php|php\d|phtml|phar)$">
#     Require all denied
# </FilesMatch>

# --- Block direct access to PHP inside wp-content/uploads (alt, root) -
# RewriteEngine On
# RewriteRule ^wp-content/uploads/.*\.(?i:php|phtml|phar)$ - [F]

# --- Limit / disable XML-RPC if unused -------------------------------
<Files xmlrpc.php>
    Require all denied
</Files>

# --- Restrict access to wp-admin by IP (optional; adjust IPs) --------
# <Directory "/var/www/html/wp-admin">
#     Require ip 203.0.113.0/24
# </Directory>


