name: Documentation improvement
description: Suggest clearer installation, contribution, or public-facing documentation.
title: "Improve docs: "
labels: ["documentation"]
body:
  - type: input
    id: affected-file
    attributes:
      label: Affected file
      placeholder: README.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is unclear, missing, or hard to follow?
    validations:
      required: true
  - type: textarea
    id: suggested-change
    attributes:
      label: Suggested change
      description: Describe the improvement.
    validations:
      required: false
